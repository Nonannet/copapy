name: Build and Publish Wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build_stencils:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nonannet/cross_compiler_unix:3
    steps:
      - uses: actions/checkout@v7

      - name: Build object files
        run: bash tools/crosscompile.sh

      - uses: actions/upload-artifact@v7
        with:
          name: stencil-object-files
          path: src/copapy/obj/*.o

      - uses: actions/upload-artifact@v7
        with:
          name: musl-object-files
          path: /object_files/*

  build_wheels:
    if: contains(github.ref, '-beta') == false
    needs: [build_stencils]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          name: stencil-object-files
          path: src/copapy/obj

      - uses: actions/download-artifact@v8
        with:
          name: musl-object-files
          path: /tmp/musl-object-files

      # Separate untracked file: modifying the tracked LICENSE would mark the
      # tree as dirty and turn the release version into a dev version
      - name: Add musl copyright notice as license file
        run: cp /tmp/musl-object-files/COPYRIGHT LICENSE-MUSL.txt

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Vendor pelfy
        run: |
          git clone --depth 1 https://github.com/Nonannet/pelfy.git /tmp/pelfy
          mkdir -p src/${{ github.event.repository.name }}/_vendor
          cp -r /tmp/pelfy/src/pelfy src/${{ github.event.repository.name }}/_vendor/

      # Only needed for Linux ARM builds
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_ARCHS_LINUX: "x86_64 aarch64 armv7l i686"
          CIBW_ARCHS_MACOS: "x86_64 universal2"
          CIBW_ARCHS_WINDOWS: "AMD64"  # x86
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "pytest -m \"not runner\" {package}/tests/"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    # Only tagged releases are published, not manual runs from a branch
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-beta') == false
    needs: [build_wheels]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/${{ github.event.repository.name }}/

    steps:
      - name: Install Twine
        run: pip install --force-reinstall twine==6.2.0

      - uses: actions/download-artifact@v8
        with:
          path: wheelhouse

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        
        run: find wheelhouse -name "*.whl" -print0 | xargs -0 python -m twine upload
