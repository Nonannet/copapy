name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

jobs:
  build_stencils:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nonannet/cross_compiler_unix:4
    steps:
      - uses: actions/checkout@v7

      - name: Build & test aux functions
        run: bash tools/test_stencil_aux.sh

      - name: Build object files
        run: bash tools/crosscompile.sh

      - uses: actions/upload-artifact@v7
        with:
          name: stencil-object-files
          path: src/copapy/obj/*.o

      - uses: actions/upload-artifact@v7
        with:
          name: musl-object-files
          path: /object_files/*

  build-package-test:
    needs: [build_stencils]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        name: stencil-object-files
        path: src/copapy/obj

    - uses: actions/download-artifact@v8
      with:
        name: musl-object-files
        path: /tmp/musl-object-files

    - name: Add musl and CMSIS-DSP copyright notices as license files
      run: |
        cp /tmp/musl-object-files/COPYRIGHT LICENSE-MUSL.txt
        cp /tmp/musl-object-files/CMSIS-DSP-LICENSE LICENSE-CMSIS-DSP.txt
        cp /tmp/musl-object-files/CMSIS-DSP-ComputeLibrary-LICENSE LICENSE-CMSIS-DSP-ComputeLibrary.txt

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        python -m pip install .
        python -m pip install pytest

    - name: Vendor pelfy
      run: |
        git clone --depth 1 https://github.com/Nonannet/pelfy.git /tmp/pelfy
        mkdir -p src/${{ github.event.repository.name }}/_vendor
        cp -r /tmp/pelfy/src/pelfy src/${{ github.event.repository.name }}/_vendor/

    - name: Run tests with pytest
      run: pytest -m "not runner"

  build-ubuntu:
    needs: [build_stencils]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        name: stencil-object-files
        path: src/copapy/obj

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: python -m pip install .[dev]

    - name: Compile coparun
      run: |
        mkdir -p build/runner
        gcc -O3 -static -DENABLE_BASIC_LOGGING -o build/runner/coparun src/coparun/runmem.c src/coparun/coparun.c src/coparun/mem_man.c

    - name: Generate debug asm files
      if: strategy.job-index == 0
      run: |
        set -e
        set -v
        bash tools/create_asm.sh

        echo '<p>example</p>' >> $GITHUB_STEP_SUMMARY
        python tools/clean_asm.py build/runner/example.asm >> $GITHUB_STEP_SUMMARY

        # echo '<p>stencils_x86_64_O3.o</p>' >> $GITHUB_STEP_SUMMARY
        # python tools/clean_asm.py build/runner/stencils.asm >> $GITHUB_STEP_SUMMARY

    - name: Run tests with pytest
      run: pytest

    - name: Type checking with mypy
      run: mypy

    #- name: Lint code with flake8
    #  run: flake8

    - uses: actions/upload-artifact@v7
      if: strategy.job-index == 0
      with:
        name: runner-linux-x86_64
        path: build/runner/*

  build-ubuntu32:
    needs: [build_stencils]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: stencil-object-files
        path: src/copapy/obj
    - name: Build and test 32-bit
      run: |
        docker run --rm -v $PWD:/app -w /app ghcr.io/nonannet/x86_test:1 \
        bash -lc "set -x && \
                  . /opt/venv/bin/activate && \
                  pip install .[mindev] && \
                  mkdir -p build/runner && \
                  gcc -m32 -O3 -static -DENABLE_LOGGING -o build/runner/coparun src/coparun/runmem.c \
                  src/coparun/coparun.c src/coparun/mem_man.c && \
                  cp build/runner/coparun build/runner/coparun-x86 && \
                  pytest && \
                  bash tools/create_asm.sh"

    - uses: actions/upload-artifact@v7
      with:
        name: runner-linux-x86
        path: build/runner/*

  build-arm64:
    needs: [build_stencils]
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: stencil-object-files
        path: src/copapy/obj
    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Install Python dependencies
      run: python -m pip install .[dev]
    - name: Compile coparun
      run: |
        mkdir -p build/runner
        gcc -O3 -static -DENABLE_LOGGING -o build/runner/coparun src/coparun/runmem.c src/coparun/coparun.c src/coparun/mem_man.c
    - name: Run tests with pytest
      run: pytest
    - name: Create assembly listings
      run: bash tools/create_asm.sh

    - uses: actions/upload-artifact@v7
      with:
        name: runner-linux-arm64
        path: build/runner/*

  # All 32 bit ARM variants are tested sequentially in one job. The ARM64 host
  # executes the 32 bit code natively, including the Thumb code for Cortex-M.
  build-arm32:
    needs: [build_stencils]
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: stencil-object-files
        path: src/copapy/obj
    # One runner for all variants, compiled with the default target of the
    # ARMv6 container: it runs on ARMv6 and ARMv7 and can call the Thumb code
    # of the other variants
    - name: Test ARMv6 and ARMv7 variants in ARMv6 container
      run: |
        docker run --rm -v $PWD:/app -w /app --platform linux/arm/v6 ghcr.io/nonannet/armv6_test:1 \
        bash -lc "set -x && \
                  pip install .[mindev] && \
                  mkdir -p build/runner && \
                  gcc -O3 -static -DENABLE_LOGGING \
                  -Wall -Wextra -Wconversion -Wsign-conversion \
                  -Wshadow -Wstrict-overflow \
                  -o build/runner/coparun src/coparun/runmem.c \
                  src/coparun/coparun.c src/coparun/mem_man.c && \
                  bash tools/test_stencil_variants.sh armv6 armv7 armv7thumb armv7mthumb armv7mthumb_fpv5"

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: runner-linux-armv6
        path: build/artifacts/runner-linux-armv6/*
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: runner-linux-armv7
        path: build/artifacts/runner-linux-armv7/*
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: runner-linux-armv7thumb
        path: build/artifacts/runner-linux-armv7thumb/*
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: runner-linux-armv7mthumb
        path: build/artifacts/runner-linux-armv7mthumb/*
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: runner-linux-armv7mthumb_fpv5
        path: build/artifacts/runner-linux-armv7mthumb_fpv5/*

  build-riscv64:
    # The emulation of RISC-V 64 is slow, therefore only the tests executing
    # the stencils most directly are run instead of the full test suite
    needs: [build_stencils]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: stencil-object-files
        path: src/copapy/obj
    - name: Set up QEMU for RISC-V 64
      uses: docker/setup-qemu-action@v4
      with:
        platforms: linux/riscv64
    - name: Use RISC-V 64 container
      run: |
        docker run --rm -v $PWD:/app -w /app --platform linux/riscv64 ghcr.io/nonannet/riscv64_test:1 \
        bash -lc "set -x && \
                  pip install .[mindev] && \
                  mkdir -p build/runner && \
                  gcc -static \
                  -Wall -Wextra -Wconversion -Wsign-conversion \
                  -Wshadow -Wstrict-overflow -O3 \
                  -DENABLE_LOGGING \
                  -o build/runner/coparun src/coparun/runmem.c \
                  src/coparun/coparun.c src/coparun/mem_man.c && \
                  pytest tests/test_coparun_module.py tests/test_math.py \
                  tests/test_casts.py tests/test_min_max.py tests/test_dynamic_index.py && \
                  bash tools/create_asm.sh"

    - uses: actions/upload-artifact@v7
      with:
        name: runner-linux-riscv64
        path: build/runner/*

  build-riscv32:
    # No Linux distribution with Python exists for RISC-V 32 bit, therefore
    # only the runner is tested with qemu-user instead of the full test suite
    needs: [build_stencils]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: stencil-object-files
        path: src/copapy/obj
    - name: Build RISC-V 32 runner
      # No login shell (bash -l): /etc/profile would reset the PATH of the image,
      # which contains the RISC-V 32 toolchain
      run: |
        mkdir -p build/runner
        docker run --rm -v $PWD:/app -w /app ghcr.io/nonannet/cross_compiler_unix:4 \
        bash -c "set -x && \
                  riscv32-unknown-linux-musl-gcc -static \
                  -Wall -Wextra -Wconversion -Wsign-conversion \
                  -Wshadow -Wstrict-overflow -O3 \
                  -DENABLE_LOGGING \
                  -o build/runner/coparun-riscv32 src/coparun/runmem.c \
                  src/coparun/coparun.c src/coparun/mem_man.c"
    - name: Install qemu-user and RISC-V binutils
      run: sudo apt-get update && sudo apt-get install -y qemu-user binutils-riscv64-linux-gnu
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install Python dependencies
      run: python -m pip install .[mindev]
    - name: Run RISC-V 32 test with qemu-user
      run: pytest tests/test_runner_riscv32.py -W error::UserWarning
    - name: Create assembly listings
      run: bash tools/create_asm.sh
      env:
        CP_TARGET_ARCH: riscv32
        RUNNER: qemu-riscv32 build/runner/coparun-riscv32
        OBJDUMP: riscv64-linux-gnu-objdump

    - uses: actions/upload-artifact@v7
      with:
        name: runner-linux-riscv32
        path: build/runner/*

  build-armv81m:
    # The stencils for Cortex-M55 and M85 can not be executed by the host of
    # the 32 bit ARM job, therefore only the runner is tested with qemu-user
    needs: [build_stencils]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: stencil-object-files
        path: src/copapy/obj
    - name: Install qemu-user and ARM cross compiler
      run: sudo apt-get update && sudo apt-get install -y qemu-user gcc-arm-linux-gnueabihf
    - name: Build ARMv6 runner
      # The Thumb code for Cortex-M is called by the runner compiled for ARMv6,
      # the tests expect it as ARMv7 runner
      run: |
        mkdir -p build/runner
        arm-linux-gnueabihf-gcc -march=armv6 -mfpu=vfp -mfloat-abi=hard -marm -static \
        -Wall -Wextra -Wconversion -Wsign-conversion \
        -Wshadow -Wstrict-overflow -O3 \
        -DENABLE_LOGGING \
        -o build/runner/coparun-armv7 src/coparun/runmem.c \
        src/coparun/coparun.c src/coparun/mem_man.c
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install Python dependencies
      run: python -m pip install .[mindev]
    - name: Run ARMv8.1-M test with qemu-user
      run: pytest tests/test_runner_armv81mthumb.py -W error::UserWarning
    - name: Create assembly listings
      run: bash tools/create_asm.sh
      env:
        CP_TARGET_ARCH: armv81mthumb
        RUNNER: qemu-arm -cpu max build/runner/coparun-armv7
        OBJDUMP: arm-linux-gnueabihf-objdump

    - uses: actions/upload-artifact@v7
      with:
        name: runner-linux-armv81mthumb
        path: build/runner/*

  build-tricore:
    # No qemu-user exists for TriCore: the bare metal runner is tested in
    # qemu-system-tricore, controlled by tricore-elf-gdb (both in the image)
    needs: [build_stencils]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nonannet/cross_compiler_unix:4
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: stencil-object-files
        path: src/copapy/obj
    - name: Build TriCore runner
      run: bash tools/tricore/build.sh runner
    - name: Install Python dependencies
      run: |
        python3 -m venv /tmp/venv
        /tmp/venv/bin/python -m pip install .[mindev]
    - name: Run TriCore tests with qemu-system-tricore
      run: /tmp/venv/bin/python -m pytest tests/test_ops_tricore.py -W error::UserWarning

    - uses: actions/upload-artifact@v7
      with:
        name: runner-tricore
        path: build/runner/*

  build-windows:
    needs: [build_stencils]
    runs-on: windows-2022

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        name: stencil-object-files
        path: src/copapy/obj

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up MSVC environment
      uses: microsoft/setup-msbuild@v3
      with:
        vs-version: 'latest'

    - name: Install Python dependencies
      run: python -m pip install .[mindev]

    - name: Compile coparun
      shell: cmd
      run: |
        mkdir build\runner
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64
        python tools\hexdump_annotated.py -r src\coparun\x86_64_abi_shim.hex build\runner\x86_64_abi_shim.obj
        cl /DENABLE_BASIC_LOGGING /O2 src\coparun\runmem.c src\coparun\coparun.c src\coparun\mem_man.c build\runner\x86_64_abi_shim.obj /Fe:build\runner\coparun.exe

    - name: Run tests with pytest
      run: pytest

    - uses: actions/upload-artifact@v7
      if: strategy.job-index == 0
      with:
        name: runner-win
        path: build/runner/*

  release-stencils:
    needs: [build_stencils, build-ubuntu, build-ubuntu32, build-windows, build-arm64, build-arm32, build-armv81m, build-riscv64, build-riscv32, build-tricore]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: tmp

      - name: Get version tag name
        id: version
        run: echo "version=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Release stencils
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -v
          mkdir -p release
          cp tmp/stencil-object-files/* release/
          cp tmp/musl-object-files/*.o release/
          cp tmp/musl-object-files/COPYRIGHT release/MUSL-COPYRIGHT.txt
          cp tmp/musl-object-files/CMSIS-DSP-LICENSE release/CMSIS-DSP-LICENSE.txt
          cp tmp/musl-object-files/CMSIS-DSP-ComputeLibrary-LICENSE release/CMSIS-DSP-ComputeLibrary-LICENSE.txt
          cp tmp/runner-linux-x86_64/coparun release/
          cp tmp/runner-linux-x86/coparun release/coparun-x86
          cp tmp/runner-linux-arm64/coparun release/coparun-aarch64
          cp tmp/runner-linux-armv6/coparun release/coparun-armv6
          cp tmp/runner-linux-armv7/coparun release/coparun-armv7
          cp tmp/runner-linux-riscv64/coparun release/coparun-riscv64
          cp tmp/runner-linux-riscv32/coparun-riscv32 release/
          cp tmp/runner-win/coparun*.exe release/

          TAG="${{ steps.version.outputs.version }}"

          if ! gh release view "$TAG" &>/dev/null; then
            echo "Creating new stencil release $TAG"
            gh release create "$TAG" release/* \
              --prerelease \
              --title "$TAG" \
              --notes "Automated release stencil for $TAG"
          else
            echo "Updating existing release for $TAG"
            gh release upload "$TAG" release/* --clobber
          fi

  build-docs:
    needs: [build_stencils, build-ubuntu, build-ubuntu32, build-windows, build-arm64, build-arm32, build-armv81m, build-riscv64, build-riscv32]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: stencil-object-files
          path: src/copapy/obj

      - uses: actions/download-artifact@v8
        with:
          path: build/tmp

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install package and dependencies
        run: pip install .[doc_build]

      - name: Build Docs
        run: |
          mkdir -p build/stencils
          python stencils/generate_stencils.py build/stencils/stencils.c
          cd docs
          make html
          touch build/html/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

  deploy-docs:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5