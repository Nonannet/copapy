# The MPU stays enabled (required by the USB driver). The main RAM (FlexRAM
# OCRAM, 256 KiB) is execute-never, the heap uses the complete 512 KiB OCRAM2
# instead, which is not covered by an MPU region.
CONFIG_COPARUN_HEAP_SECTION="OCRAM2"
CONFIG_COPARUN_HEAP_SIZE=524288

# USB serial port of the runner
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
