# The stencils use the FPU with the hard float ABI
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_FP_HARDABI=y

# Command streams are received over the console UART
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_CRC=y
CONFIG_REBOOT=y

# Device I/O channels (io.c)
CONFIG_GPIO=y

# Programs run on the main thread (RUN_PROG, RUN_TASK, STEP_TASKS) and
# periodic tasks on threads with higher priority than the main thread
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_MAIN_THREAD_PRIORITY=10
# Priorities below the main thread for degraded tasks (load shedding)
CONFIG_NUM_PREEMPT_PRIORITIES=24

# Tick of the periodic tasks: 100 us
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# CPU time of the task threads for the execution time measurement
CONFIG_THREAD_RUNTIME_STATS=y
